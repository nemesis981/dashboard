name: Build Windows Agent

on:
  push:
    branches: [main]
    tags: ['v*']          # tagged builds also attach the exe to a GitHub Release
    # NOTE: deliberately no `paths:` filter. Combining `paths:` with `tags:` causes
    # tag pushes to be skipped (a tag re-points an existing commit, so the push has
    # no changed files for the filter to match). Building on every main push is
    # cheap (~1 min) and keeps tagged releases reliable.
  workflow_dispatch: {}

permissions:
  contents: write   # needed to attach the exe to a Release on tagged builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pywin32 psutil requests cryptography plyer pythonnet

      - name: Fetch ClamAV binaries (best-effort, no definitions)
        continue-on-error: true   # a download hiccup must NOT fail the exe build
        shell: pwsh
        run: |
          $ver = "1.5.2"
          $url = "https://github.com/Cisco-Talos/clamav/releases/download/clamav-$ver/clamav-$ver.win.x64.zip"
          $zip = "$env:RUNNER_TEMP\clamav.zip"
          $dest = "nemesis_agent/clamav"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\clamav" -Force
          $inner = Get-ChildItem "$env:RUNNER_TEMP\clamav" -Directory | Select-Object -First 1
          $from = if ($inner) { "$($inner.FullName)\*" } else { "$env:RUNNER_TEMP\clamav\*" }
          Copy-Item $from $dest -Recurse -Force
          Write-Host "ClamAV staged into $dest"

      - name: Fetch LibreHardwareMonitor (best-effort, temps/fans)
        continue-on-error: true   # a download hiccup must NOT fail the exe build
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest/download/LibreHardwareMonitor.zip"
          $zip = "$env:RUNNER_TEMP\lhm.zip"
          $dest = "nemesis_agent/lhm"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\lhm" -Force
          # Flatten if the zip nested everything in a subdir; LibreHardwareMonitor.exe must land at lhm/ root.
          $inner = Get-ChildItem "$env:RUNNER_TEMP\lhm" -Directory | Where-Object { Test-Path "$($_.FullName)\LibreHardwareMonitor.exe" } | Select-Object -First 1
          $from = if ($inner) { "$($inner.FullName)\*" } else { "$env:RUNNER_TEMP\lhm\*" }
          Copy-Item $from $dest -Recurse -Force
          Write-Host "LHM staged into $dest"

      - name: Fetch PawnIO installer (temps/fans provisioning on real hardware)
        continue-on-error: true   # a download hiccup must NOT fail the exe build
        shell: pwsh
        run: |
          # PawnIO = LHM's kernel sensor driver (ring-0 temp/fan/voltage reads). The LHM
          # release zip does NOT ship the installer, so the installer's _install_pawnio step
          # was skipping ("installer not found in bundle"). Fetch it from the official source
          # (pawnio.eu -> namazso/PawnIO.Setup) into the exact path _pawnio_installer() looks
          # for: lhm\Resources\PawnIO_setup.exe. build_installer bundles the whole lhm dir
          # (incl. Resources\) into the setup exe, so it lands at %APPDATA%\Nemesis\lhm\Resources.
          $dest = "nemesis_agent/lhm/Resources"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = "https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dest/PawnIO_setup.exe" -UseBasicParsing
          Write-Host "PawnIO installer staged into $dest"

      - name: Build NemesisAgent-Setup.exe
        run: python nemesis_agent/build_installer.py

      - name: Bundle installer + docs (zip)
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0,7) }
          $stage = "nemesis_agent/dist/bundle"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item nemesis_agent/dist/NemesisAgent-Setup.exe $stage/
          Copy-Item docs/operation/INSTALL_WINDOWS_BEGINNER.md     "$stage/START_HERE_BEGINNER.md"
          Copy-Item docs/operation/INSTALL_WINDOWS_INTERMEDIATE.md "$stage/INSTALL_INTERMEDIATE.md"
          Copy-Item docs/operation/INSTALL_WINDOWS_PRO.md          "$stage/INSTALL_PRO.md"
          $zip = "nemesis_agent/dist/NemesisAgent-$ver-Windows.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Host "Bundled: $zip"

      - name: Upload artifacts (exe + bundle zip)
        uses: actions/upload-artifact@v4
        with:
          name: NemesisAgent-Windows
          path: |
            nemesis_agent/dist/NemesisAgent-Setup.exe
            nemesis_agent/dist/NemesisAgent.exe
            nemesis_agent/dist/NemesisAgent-*-Windows.zip
          if-no-files-found: error

      - name: Attach to Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nemesis_agent/dist/NemesisAgent-Setup.exe
            nemesis_agent/dist/NemesisAgent.exe
            nemesis_agent/dist/NemesisAgent-*-Windows.zip
