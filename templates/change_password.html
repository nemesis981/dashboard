<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nemesis Firewall — Change Password</title>
  <style>
    body { background:#0d0d1e; color:#eee; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
           margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#16213e; border:1px solid #00d4ff33; border-radius:12px;
            padding:32px 34px; width:92%; max-width:420px; box-shadow:0 8px 40px #0008; }
    h1 { color:#00d4ff; margin:0 0 6px; font-size:1.3em; text-align:center; }
    .who { text-align:center; color:#8a98b3; font-size:0.8em; margin:0 0 20px; }
    label { display:block; margin:14px 0 4px; font-size:0.86em; color:#ccd; }
    input { width:100%; box-sizing:border-box; background:#0d0d1e; border:1px solid #334;
            color:#eee; padding:9px 11px; border-radius:7px; font-size:0.95em; }
    input:focus { outline:none; border-color:#00d4ff; }
    button { width:100%; margin-top:22px; background:#00d4ff; color:#062; border:none;
             border-radius:8px; padding:11px; font-size:1em; font-weight:bold; cursor:pointer; }
    .error { background:#ff444422; border:1px solid #ff4444; color:#ff8888;
             border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:0.85em; }
    .success { background:#00d4ff22; border:1px solid #00d4ff; color:#8fe9ff;
               border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:0.85em; }
    .hint { color:#888; font-size:0.78em; margin:2px 0 0; }
    .gen { background:#0d0d1e; border:1px solid #2a3450; border-radius:7px;
           padding:10px 12px; margin:16px 0 4px; }
    .gen code { color:#00d4ff; font-size:0.95em; word-break:break-all; }
    .gen a { color:#8a98b3; font-size:0.78em; text-decoration:none; cursor:pointer; }
    .back { display:block; margin-top:18px; text-align:center; color:#6b7689;
            font-size:0.8em; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#128273; Change Password</h1>
    <p class="who">Signed in as {{ username }}</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}

    <form method="POST" action="/account/password">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password"
             autocomplete="current-password" autofocus>
      <p class="hint">Required even though you&#39;re signed in &mdash; it confirms it&#39;s you
         at the keyboard, not just an open session.</p>

      <div class="gen">
        <code id="genPass">&mdash;</code><br>
        <a onclick="regen()">Suggest a passphrase</a>
      </div>

      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password"
             autocomplete="new-password">

      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             autocomplete="new-password">

      <button type="submit">Change Password</button>
    </form>

    <a class="back" href="/">&larr; Back to dashboard</a>
  </div>

  <script>
    function regen() {
      fetch('/api/passphrase/generate').then(function(r){ return r.json(); })
        .then(function(d){ document.getElementById('genPass').textContent = d.passphrase; })
        .catch(function(){});
    }
  </script>
</body>
</html>
