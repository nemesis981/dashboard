<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nemesis Firewall — Log In</title>
  <style>
    body { background:#0d0d1e; color:#eee; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
           margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#16213e; border:1px solid #00d4ff33; border-radius:12px;
            padding:32px 34px; width:92%; max-width:380px; box-shadow:0 8px 40px #0008; }
    h1 { color:#00d4ff; margin:0 0 22px; font-size:1.4em; text-align:center; }
    label { display:block; margin:14px 0 4px; font-size:0.86em; color:#ccd; }
    input { width:100%; box-sizing:border-box; background:#0d0d1e; border:1px solid #334;
            color:#eee; padding:9px 11px; border-radius:7px; font-size:0.95em; }
    input:focus { outline:none; border-color:#00d4ff; }
    button { width:100%; margin-top:22px; background:#00d4ff; color:#062; border:none;
             border-radius:8px; padding:11px; font-size:1em; font-weight:bold; cursor:pointer; }
    .error { background:#ff444422; border:1px solid #ff4444; color:#ff8888;
             border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:0.85em; }
    .login-hint { margin-top:20px; font-size:0.72em; color:#6b7689; text-align:center;
                  line-height:1.6; }
    .login-hint code { background:#0d0d1e; border:1px solid #2a3450; border-radius:4px;
                       padding:1px 5px; color:#8a98b3; font-size:0.95em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#128737; Nemesis Firewall</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next or '' }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Log In</button>
    </form>
    <p class="login-hint" style="margin-top:16px">
      <a href="/login/recovery" style="color:#00d4ff;text-decoration:none">Use a recovery code instead</a>
    </p>
    <p class="login-hint">
      No recovery codes either? Access your Nemesis box via SSH and run:<br>
      <code>sudo python3 /opt/nemesis/core/manage.py reset-password &lt;username&gt;</code><br>
      Requires root &mdash; it changes account credentials.
    </p>
  </div>
</body>
</html>
